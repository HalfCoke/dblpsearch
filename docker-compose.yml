version: '3.9'
services:
  dblp_data_process:
    image: registry.cn-beijing.aliyuncs.com/env_halfcoke/dblp-data-process:1.1.0
    container_name: dblp_data_process
    command:
      - "python"
      - "main.py"
    volumes:
      - type: volume
        source: dblpweblog
        target: /var/log
      - type: volume
        source: dblpwebconf
        target: /opt/dblpDataProcess/conf
      - type: volume
        source: dblpdata
        target: /opt/dblpDataProcess/resources
      - type: volume
        source: dblpdb
        target: /opt/dblpDataProcess/db
    networks:
      - dblpweb

  dblp_web_backend:
    image: registry.cn-beijing.aliyuncs.com/env_halfcoke/dblp-web-backend:2.3.0
    container_name: dblp_web_backend
    depends_on:
      - "search_data_storage"
    ports:
      - 5051:5051
    volumes:
      - type: volume
        source: dblpweblog
        target: /var/log
      - type: volume
        source: dblpwebconf
        target: /opt/dblpWebBackend/conf
      - type: volume
        source: dblpdb
        target: /opt/dblpWebBackend/db
    networks:
      - dblpweb

  webserver:
    image: nginx:1.19.7-alpine
    container_name: webserver
    depends_on:
      - "dblp_web_backend"
    volumes:
      - type: volume
        source: nginx_conf
        target: /etc/nginx
      - type: volume
        source: html
        target: /usr/share/nginx/html
    ports:
      - 61080:80
    networks:
      - dblpweb

  search_data_storage:
    image: redis:6-alpine
    container_name: search_data_storage
    volumes:
      - redis_data:/data
    networks:
      - dblpweb

volumes:
  dblpweblog:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/dblpweb/logs'
  dblpwebconf:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/dblpweb/conf'
  dblpdata:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/dblpweb/data'
  dblpdb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/dblpweb/db'
  nginx_conf:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/nginx/conf'
  html:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/opt/dblpweb/searchwebui/dist'
  redis_data:
    driver: local
networks:
  dblpweb:
    driver: bridge
